# src/main/resources/application-prod.yml
# Configuration spécifique pour Render (production)

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}  # Render fournit cette variable
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate  # IMPORTANT: pas 'update' en production!
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}  # Render définit PORT automatiquement
  error:
    include-stacktrace: never
    include-message: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.onrender.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
  allow-credentials: true
  max-age: 3600

logging:
  level:
    root: WARN
    com.mohamedbendali.sigc: INFO
    org.springframework: WARN
    org.hibernate: ERROR
    org.springframework.security: WARN

# Désactiver certaines fonctionnalités en production
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Configuration des fichiers upload (à adapter)
file:
  upload-dir: /tmp/sigc-uploads  # Sur Render, utilisez /tmp